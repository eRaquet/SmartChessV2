[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

###########
# project #
###########

[project]
name = "smartchess-v2"
version = "0.1.0"
description = "Reinforcement Learning Chess AI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["chess>=1.11.2", "numpy>=2.2.6", "typer>=0.27.0"]

[dependency-groups]
test = ["pytest>=9.1.1"]
quality = ["ruff>=0.15.22", "ty>=0.0.61"]
gui = ["pygame>=2.6.1"]
plot = ["matplotlib>=3.11.1"]
profile = ["tuna>=0.5.15"]
table = ["tabulate>=0.10.0"]
tools = ["git-lfs>=1.6", "poethepoet>=0.48.0"]
backend-mlx = [
    "keras @ git+https://github.com/keras-team/keras.git@mlx",
    "mlx>=0.32.0",
]
backend-jax = ["jax>=0.10.2", "keras>=3.15.0"]
dev = [
    { include-group = "test" },
    { include-group = "quality" },
    { include-group = "gui" },
    { include-group = "plot" },
    { include-group = "profile" },
    { include-group = "table" },
    { include-group = "tools" },
    { include-group = "backend-mlx" },
]

[project.scripts]
smartchess = 'smartchess.cli.main:main'

#######
# poe #
#######

[tool.poe.tasks]
lint = "ruff check ."
format_check = "ruff format --check ."
format = "ruff format ."
check_fix = "ruff check . --fix"
type_check = "ty check ."
test = "pytest ."
check = ["lint", "format_check", "type_check"]
fix = ["format", "check_fix"]
run = ["test"]
all = ["check", "fix", "run"]

######
# ty #
######

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
all = "error"


########
# ruff #
########

[tool.ruff]
line-length = 100
indent-width = 4

target-version = "py312"

[tool.ruff.lint]

# Enabled Rules
select = ["ALL"]
ignore = ["T201", "COM812"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]

# ignore rules for specific files
[tool.ruff.lint.per-file-ignores]
"test/*" = [
    "D103", # undocumented-public-function (missing docstring in public function)
    "S101", # assert (use of assert detected)
]
"src/smartchess/model/inference_model.py" = [
    "E402", # import not at top of file
]
"src/smartchess/cli/**" = [
    "FBT002",  # Typer boolean flag declarations use boolean defaults
    "TC003",   # Typer needs Path available when evaluating command annotations
    "PLC0415", # CLI needs to use lazy imports to save on load time
]
"src/smartchess/**/__init__.py" = [
    "PLC0415", # import should be at top level of file
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.lint.pylint]
max-args = 15
max-locals = 25
max-branches = 20

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
docstring-quotes = "double"

[tool.ruff.format]
quote-style = "single" # change to "double" or "single" if either is preferred
indent-style = "space"
line-ending = "auto"

######
# uv #
######

[tool.uv]
default-groups = ["dev"]
conflicts = [[{ group = "backend-mlx" }, { group = "backend-jax" }]]
